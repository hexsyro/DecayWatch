[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decaywatch"
version = "0.1.0"
description = "Measure how much of a collected dataset still exists: snapshot survival, metadata drift, representativity, and a purge list."
readme = "README.md"
license = "MIT"
authors = [{ name = "hexsyro", email = "hexsyro@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["dataset", "data-decay", "link-rot", "provenance", "data-quality", "archival"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
decaywatch = "decaywatch.cli:main"

[project.urls]
Homepage = "https://github.com/hexsyro/DecayWatch"
Repository = "https://github.com/hexsyro/DecayWatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
